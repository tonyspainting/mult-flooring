# Mult Flooring: nginx configuration for the SPA
# Copied to /etc/nginx/conf.d/app.conf in the final image.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Está atrás do proxy do Coolify (Traefik), que termina o TLS. Sem isso o
    # nginx builds the Location with http:// and the redirect loses https.
    absolute_redirect off;

    # ── www → apex ─────────────────────────────────────────
    # The canonical URL has no www (sitemap, schema and all URLs). Visitors
    # arriving through www.multflooring.com go to the root domain, so the
    # Server-level directive: it runs before location selection.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # ── Cabeçalhos de segurança ────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Compressão ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Healthcheck (Coolify) ──────────────────────────────
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Form: /api/* goes to the form-api container ────────
    # The variable resolver keeps nginx from refusing to start
    # when form-api is absent (site-only deploy): in that case
    # a rota responde 502 em vez de derrubar o container.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $form_api "http://form-api:3000";
        proxy_pass $form_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # ── Assets versionados do build: cache imutável ────────
    # Hashed names (index-DonR9U4c.js), so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── Images, video and fonts: 30 days ───────────────────
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|mp4|webm|ogg|woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ── Service worker e manifest: sempre revalidar ────────
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # ── Legacy CRM routes and dynamic catalog: gone ────────
    # /products was a database listing (removed). The equivalent
    # content is now the static catalog at /flooring.
    location ~ ^/(dashboard|login|products-admin)(/.*)?$ {
        return 404;
    }
    location = /products {
        return 301 /flooring;
    }

    # ── Trailing slash: the canonical has none ─────────────
    # Avoids duplicate content (/flooring and /flooring/) and keeps the
    # canonical matching the served URL.
    location ~ ^/(.+)/$ {
        return 301 /$1;
    }

    # ── SPA: rotas pré-renderizadas primeiro ────────────────
    # Order matters: /route/index.html is tried BEFORE the raw path, otherwise
    # nginx answers 301 to the trailing slash and the canonical stops
    # matching. If nothing matches, it falls back to @not_found (a real 404).
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri/index.html $uri $uri/ @not_found;
    }

    location @not_found {
        return 404;
    }

    # Página de erro própriamente dita (servida em qualquer 404).
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ── Erros de servidor ──────────────────────────────────
    # 5xx also renders the error page: better than returning the home page
    # with a failure status (Google treats that as a soft 404).
    error_page 500 502 503 504 /404.html;
}
