# Mult Flooring — configuração do nginx para o SPA
# Copiado para /etc/nginx/conf.d/app.conf na imagem final.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Está atrás do proxy do Coolify (Traefik), que termina o TLS. Sem isso o
    # nginx monta o Location com http:// e o redirect perde o https.
    absolute_redirect off;

    # ── www → apex ─────────────────────────────────────────
    # O canônico é sem www (sitemap, schema e todas as URLs). Quem chega por
    # www.multflooring.com vai para o domínio raiz, sem duplicar conteúdo.
    # Diretiva de nível de servidor: roda antes da escolha do location.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # ── Cabeçalhos de segurança ────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Compressão ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Healthcheck (Coolify) ──────────────────────────────
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Formulário: /api/* vai para o container form-api ────
    # O resolver com variável evita que o nginx se recuse a subir
    # quando o form-api não existe (deploy só do site): nesse caso
    # a rota responde 502 em vez de derrubar o container.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $form_api "http://form-api:3000";
        proxy_pass $form_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # ── Assets versionados do build: cache imutável ────────
    # Nomes com hash (index-DonR9U4c.js), então nunca mudam.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── Imagens, vídeos e fontes: 30 dias ──────────────────
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|mp4|webm|ogg|woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ── Service worker e manifest: sempre revalidar ────────
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # ── Rotas do CRM antigo e catálogo dinâmico: não existem mais ──
    # /products era uma listagem vinda do banco (removido). O conteúdo
    # equivalente agora é o catálogo estático em /flooring.
    location ~ ^/(dashboard|login|products-admin)(/.*)?$ {
        return 404;
    }
    location = /products {
        return 301 /flooring;
    }

    # ── Barra final: canonical é sem barra ─────────────────
    # Evita conteúdo duplicado (/flooring e /flooring/) e mantém o canonical
    # batendo com a URL servida.
    location ~ ^/(.+)/$ {
        return 301 /$1;
    }

    # ── SPA: rotas pré-renderizadas primeiro ────────────────
    # A ordem importa: procura /rota/index.html ANTES do caminho puro, senão o
    # nginx responde 301 para a barra final e o canonical (sem barra) deixa de
    # bater. Se nada casar, cai no @not_found (404 real, não soft 404).
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri/index.html $uri $uri/ @not_found;
    }

    location @not_found {
        return 404;
    }

    # Página de erro própriamente dita (servida em qualquer 404).
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ── Erros de servidor ──────────────────────────────────
    # 5xx também cai na página de erro: melhor que devolver a home com status
    # de falha (o Google trata como soft 404).
    error_page 500 502 503 504 /404.html;
}
