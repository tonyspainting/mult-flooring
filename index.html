<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mult Flooring" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Static fallback title, used before React mounts.
      The meta description is NOT set here: each route defines its own
      through the SEO component (react-helmet). A fixed value here would
      add a second description to every page.
    -->
    <title>Mult Flooring — Hardwood, Vinyl &amp; Laminate Installation | MA, RI &amp; CT</title>

    <!-- Geo tags -->
    <meta name="geo.region" content="US-MA" />
    <meta name="geo.placename" content="East Bridgewater, Massachusetts" />
    <meta name="geo.position" content="42.0334;-70.9578" />
    <meta name="ICBM" content="42.0334, -70.9578" />

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Mult Flooring" />

    <!-- Open Graph / Twitter static fallback; the per-route SEO overrides it -->
    <meta property="og:site_name" content="Mult Flooring" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://multflooring.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://multflooring.com/og-image.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
