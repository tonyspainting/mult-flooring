# LOCAL testing only (`docker compose up --build`).
#
# Coolify passes `-f docker-compose.yml` explicitly, so this file is ignored on
# the server: there the port is not published on the host and the proxy reaches
# the container over the internal network.
#
# Here port 8080 is published so you can open http://localhost:8080.

services:
  web:
    ports:
      - "8080:80"
