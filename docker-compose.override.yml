# Só para testes LOCAIS (`docker compose up --build`).
#
# O Coolify usa explicitamente `-f docker-compose.yml`, então este arquivo é
# ignorado no servidor — lá a porta não é publicada no host, e o proxy acessa
# o container pela rede interna.
#
# Aqui a porta 8080 é publicada para você abrir http://localhost:8080.

services:
  web:
    ports:
      - "8080:80"
