# Mult Flooring — dois containers:
#   web       → nginx servindo o site estático (porta 80) e /api/* → form-api
#   form-api  → Node service that sends the form by e-mail via Resend
#
# Uso local:
#   cp form-api/.env.example form-api/.env   # e preencha RESEND_API_KEY
#   docker compose up --build
#   abrir http://localhost:8080
#   (a porta vem do docker-compose.override.yml, que o Coolify ignora)
#
# On Coolify: use the "Docker Compose" build pack with this file.
# The domain is attached to the `web` service on port 80, internal network.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Empty = same domain (/api/lead). Fill in only if the API lives
        # at another address, e.g. https://api.multflooring.com/lead
        VITE_FORM_ENDPOINT: ${VITE_FORM_ENDPOINT:-}
    image: mult-flooring-web:latest
    container_name: mult-flooring-web
    # NÃO publicar porta no host: no Coolify o proxy (Traefik) alcança o
    # container over the internal network. Publishing "8080:80" collides
    # do próprio servidor. Para testar na sua máquina, use o
    # docker-compose.override.yml, which adds the port locally only.
    expose:
      - "80"
    depends_on:
      - form-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  form-api:
    build:
      context: ./form-api
      dockerfile: Dockerfile
    image: mult-flooring-form-api:latest
    container_name: mult-flooring-form-api
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      LEAD_TO: ${LEAD_TO:-multflooring@gmail.com}
      LEAD_FROM: ${LEAD_FROM:-Mult Flooring <leads@multflooring.com>}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://multflooring.com,https://www.multflooring.com}
      DEBUG_ERRORS: ${DEBUG_ERRORS:-false}
      PORT: "3000"
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
