<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Mult Flooring</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      :root {
        --bg: #faf7f4;
        --text: #1a1a1a;
        --muted: #6b5c4a;
        --accent: #7a4f1e;
        --border: #e0cdb8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main { max-width: 560px; }
      .code {
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(34px, 6vw, 52px);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 14px 0 16px;
      }
      p { color: var(--muted); line-height: 1.7; margin: 0 0 28px; }
      nav { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      a.primary { background: var(--accent); color: #fff; }
      a.secondary { border: 1px solid var(--border); color: var(--accent); background: transparent; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">Error 404</div>
      <h1>This page doesn't exist.</h1>
      <p>
        The link may be old or mistyped. Our catalog and services are still here —
        hardwood, vinyl and laminate flooring plus kitchen cabinets across MA, RI and CT.
      </p>
      <nav>
        <a class="primary" href="/">Go to home</a>
        <a class="secondary" href="/flooring">Browse the catalog</a>
        <a class="secondary" href="/contact">Get a quote</a>
      </nav>
    </main>
  </body>
</html>
